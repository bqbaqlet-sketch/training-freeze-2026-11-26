.nav-inner.nav-scrollable {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) clamp(50px, 15vw, 72px);
  align-items: start;
  width: min(calc(100% - 10px), 680px);
  gap: 5px;
}
.nav-rail {
  display: flex;
  align-items: stretch;
  min-width: 0;
  gap: 4px;
  padding: 0 2px 3px;
  overflow-x: auto;
  overscroll-behavior-inline: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
.nav-rail button { flex: 1 0 clamp(59px, 18.5vw, 87px); }
.nav-scrollable button { min-height: 48px; font-size: .74rem; line-height: 1.13; }
.nav-scrollable button:hover { background: var(--accent-2); }
.nav-scrollable button:focus-visible { outline-offset: -3px; }
.nav-scrollable .nav-more {
  color: var(--accent);
  border: 1px solid var(--line);
  background: var(--paper);
}
.nav-scrollable .nav-more[aria-expanded="true"],
.nav-scrollable .nav-more-active { background: var(--accent-2); }
.nav-more-panel {
  position: absolute;
  inset-inline-end: 0;
  bottom: calc(100% + 12px);
  z-index: 1;
  width: min(230px, 100%);
  max-height: min(320px, 62dvh);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--paper);
  box-shadow: 0 9px 25px #201d352b;
}
.nav-scrollable .nav-more-panel button {
  grid-template-columns: 1.35rem 1fr;
  justify-items: start;
  gap: 9px;
  width: 100%;
  min-height: 44px;
  padding: 6px 10px;
  text-align: start;
  font-size: .9rem;
}

:root {
  --bg: #f4f0ff;
  --paper: #fffdff;
  --ink: #251747;
  --muted: #5e5079;
  --line: #dfd4f2;
  --accent: #5d26b6;
  --accent-2: #efe3ff;
  --mint: #c2ffea;
  --lesson-surface: #e6f9f7;
  --page-wash: #dff6ff;
  --shadow: 0 12px 34px #48258c13;
}

:root[data-theme=dark] {
  --bg: #171024;
  --paper: #231734;
  --ink: #f8f0ff;
  --muted: #d3c3e8;
  --line: #4d3969;
  --accent: #d5b7ff;
  --accent-2: #3c2459;
  --lesson-surface: #19363e;
  --page-wash: #1e3049;
  --shadow: 0 12px 34px #0500103b;
}

body {
  background:
    radial-gradient(ellipse at 6% 10%, var(--page-wash), transparent 48%),
    radial-gradient(ellipse at 91% 0%, var(--accent-2), transparent 48%),
    var(--bg);
  min-height: 100vh;
}

.top {
  background: var(--paper);
  box-shadow: 0 4px 18px #3513690d;
}

.brand-mark, .setup-logo, .mascot-poster {
  position: relative;
  overflow: hidden;
  isolation: isolate;
}

.brand-mark {
  width: 41px;
  height: 41px;
  border: 1px solid #9870eb;
  border-radius: 13px;
  background: #251351;
}

.brand-mark::before, .brand-mark::after { content: none; }

.brand-image {
  position: absolute;
  display: block;
  width: 237%;
  max-width: none;
  top: -14%;
  left: 50%;
  transform: translateX(-50%);
}

.setup-logo {
  width: 78px;
  aspect-ratio: 1;
  margin-bottom: 20px;
  border: 1px solid #bfa2ff;
  border-radius: 23px;
  box-shadow: 0 8px 20px #662ebd35;
}

.setup .card {
  border-top: 4px solid #9661ec;
  background:
    radial-gradient(ellipse at 100% 0%, var(--lesson-surface), transparent 57%),
    linear-gradient(154deg, var(--paper) 55%, var(--accent-2));
}

.hero {
  min-height: 325px;
  color: #fff;
  border: 1px solid #a47bf4;
  border-radius: 28px;
  background:
    radial-gradient(ellipse at 87% 33%, #3c83cc78, transparent 47%),
    linear-gradient(119deg, #29114f 3%, #4b1d8c 56%, #562aa6);
  box-shadow: 0 18px 46px #50259d3a;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .65;
  pointer-events: none;
  background:
    linear-gradient(128deg, transparent 58%, #c396ff43 58.2% 58.45%, transparent 58.6%),
    linear-gradient(149deg, transparent 70%, #a3e7ff38 70.2% 70.4%, transparent 70.6%),
    linear-gradient(33deg, transparent 75%, #bc93ff38 75.2% 75.4%, transparent 75.6%);
}

.hero-copy { flex: 1 1 420px; }
.hero p { color: #f0e2ff; }
.hero .pill { background: #fff2; color: #fef7ff; border: 1px solid #fff4; }
.hero .btn.positive {
  background: var(--mint);
  border-color: var(--mint);
  color: #192941;
  box-shadow: 0 6px 19px #44e7c23d;
}

.btn.primary {
  background: linear-gradient(112deg, #5b22bb, #7330ce);
  border-color: #743bd0;
  color: #fff;
}
.btn.soft { border-color: var(--line); }
.card, .row-card { border-radius: 19px; }
.progress-card, .lesson-card { padding: clamp(17px,2.7vw,24px); }
.progress-card {
  border-inline-start: 3px solid #a878f6;
  background: linear-gradient(128deg, var(--paper) 40%, var(--accent-2));
}
.lesson-card {
  border-inline-start: 3px solid #35b8ac;
  background: linear-gradient(128deg, var(--paper) 40%, var(--lesson-surface));
}
.progress-bar { height: 12px; }
.progress-bar span { background: linear-gradient(90deg, #6b2dd1, #9956e7 54%, #168980); }
.option input { accent-color: var(--accent); }
.video-cover { background: linear-gradient(135deg, var(--accent-2), var(--lesson-surface)); color: var(--accent); }
.notice { background: #3a195d; }

.bottom { box-shadow: 0 -8px 34px #2c184418; }
.nav-inner button { border-radius: 13px; }
.nav-inner button[aria-current=page] {
  background: linear-gradient(144deg, var(--accent-2), var(--lesson-surface));
  color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--line);
}
.nav-inner button:hover:not([aria-current=page]) { background: var(--accent-2); color: var(--accent); }

.mascot {
  display: grid;
  grid-template-rows: minmax(120px,1fr) auto;
  position: relative;
  align-items: center;
  isolation: isolate;
  justify-items: center;
  flex: 0 1 clamp(275px,37vw,440px);
  height: clamp(265px,28vw,325px);
  min-width: 0;
}

.mascot-glow {
  position: absolute;
  z-index: -1;
  inset: 6% 4% 8%;
  pointer-events: none;
  background:
    radial-gradient(ellipse 43% 39% at 53% 61%, #75f9e58f, #7dddfd28 58%, transparent),
    radial-gradient(ellipse 46% 43% at 52% 44%, #af74ffb8, transparent);
}

.mascot-glow::before {
  content: "";
  position: absolute;
  inset: 6% 11% 6%;
  background:
    linear-gradient(130deg, #e2caffb5, #a285ff34 40%, #8cffff24 59%, #affdfb8a),
    linear-gradient(57deg, transparent 35%, #d6d2ff55 35.5% 36%, transparent 36.5% 64%, #c4ffff5c 64.5% 65%, transparent 65.5%);
  clip-path: polygon(52% 0, 87% 22%, 100% 59%, 74% 88%, 35% 100%, 0 68%, 15% 25%);
}

.mascot-glow::after {
  content: "";
  position: absolute;
  inset: 64% 14% 7%;
  border: 1px solid #b3f9ff98;
  border-radius: 50%;
  box-shadow: 0 0 23px #8be1ff6f, inset 0 0 22px #8be1ff59;
}

.mascot-poster {
  grid-area: 1 / 1;
  width: clamp(92px,15vw,134px);
  aspect-ratio: 1;
  border-radius: 23%;
  box-shadow: 0 6px 28px #6837aa5b;
}

.mascot model-viewer {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 0;
  grid-area: 1 / 1;
  opacity: 0;
  outline-offset: -4px;
}

.mascot[data-ready="true"] model-viewer { opacity: 1; }
.mascot model-viewer::part(default-progress-bar) { display: none; }

.mascot .mascot-button {
  z-index: 1;
  min-height: 38px;
  padding-inline: 13px;
  border: 1px solid #decaff;
  border-radius: 100px;
  background: #f4e9ff;
  color: #411973;
  font-size: .83rem;
  box-shadow: 0 4px 12px #25134723;
}

.rocky-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px clamp(14px,3vw,26px);
  margin: 0 0 14px;
  max-width: 790px;
  border: 1px solid #b898ed;
  border-radius: 22px;
  background:
    radial-gradient(ellipse at 91% 32%, var(--lesson-surface), transparent 54%),
    linear-gradient(138deg, var(--paper) 10%, var(--accent-2) 70%);
  box-shadow: var(--shadow);
}

.rocky-banner .screen-header { margin: 0; }
.rocky-banner .mascot { height: 222px; flex-basis: clamp(174px,29vw,278px); }
.rocky-banner .mascot-glow { inset: 5% 2% 10%; }
.chat .chat-status { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
.chat-status::before {
  content: "";
  width: 8px;
  height: 8px;
  flex: 0 0 8px;
  border-radius: 50%;
  background: #9662e2;
  box-shadow: 0 0 0 3px var(--accent-2);
}
.chat-status.is-connected::before { background: #21897e; box-shadow: 0 0 0 3px var(--lesson-surface); }
.chat-log { background: var(--bg); border: 1px solid var(--line); border-radius: 15px; padding: 10px; }
.chat-form { margin-top: 12px; }
.bubble { width: fit-content; }
.bubble.me { border-color: var(--line); }
.chat-commands { margin-top: 11px; }

@media (max-width:620px) {
  .hero { display: grid; gap: 13px; padding: 17px; border-radius: 22px; }
  .hero h1 { font-size: clamp(1.75rem,7vw,2.6rem); }
  .hero .mascot { grid-row: 1; width: 100%; height: clamp(208px,64vw,269px); }
  .hero .mascot-glow { width: min(95%,290px); margin-inline: auto; }
  .hero-copy { width: 100%; }
  .rocky-banner {
    display: grid;
    grid-template-columns: minmax(0,1fr) minmax(112px,43%);
    padding: 11px;
  }
  .rocky-banner .screen-header h1 { font-size: clamp(1.65rem,7vw,2.15rem); }
  .rocky-banner .screen-header p { font-size: .9rem; }
  .rocky-banner .mascot {
    grid-template-rows: minmax(92px,1fr) auto;
    height: 150px;
  }
  .rocky-banner .mascot-button { min-height: 38px; padding: 4px 8px; font-size: .74rem; }
  .rocky-banner .mascot-poster { width: min(100%,84px); }
}
.book-fact-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: .4rem;
}

.book-fact-actions .btn,
.book-model-controls .btn {
  min-height: 44px;
  padding: .45rem .7rem;
  font-size: .875rem;
  line-height: 1.2;
}

.book-fact-actions .btn[aria-expanded="true"] {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--paper);
}

.book-fact-panel {
  margin-top: .6rem;
  padding: .75rem;
  border: 1px solid var(--line);
  border-radius: .8rem;
  background: var(--bg);
}

.read-fact .book-fact-panel p { margin: 0; }
.read-fact .book-fact-panel .book-model-caption { margin-top: .3rem; }
.book-model { margin: 0; }
.book-model figcaption { margin-bottom: .6rem; }
.book-model figcaption strong { font-size: 1.08rem; }
.book-model-stage {
  border: 1px solid #40616a;

:root {
  --test-map-ground: #e4f5eb;
  --test-map-slope: #bceadd;
  --test-map-contour: #488a7b49;
  --trail: #a8ccc8;
  --trail-reached: #48a6a1;
  --trail-inset: #f4fffb;
  --test-ready: #622fc2;
  --test-locked: #466c71;
  --test-correct: #096851;
  --test-correct-bg: #dcf6e9;
  --test-incorrect: #a32c63;
  --test-incorrect-bg: #fff0f5;
}

:root[data-theme=dark] {
  --test-map-ground: #112d36;
  --test-map-slope: #20484a;
  --test-map-contour: #85c7bd43;
  --trail: #44686d;
  --trail-reached: #439c9a;
  --trail-inset: #a7d9d0;
  --test-ready: #dabcff;
  --test-locked: #b9d9dd;
  --test-correct: #9aefd1;
  --test-correct-bg: #193c3a;
  --test-incorrect: #ffbad3;
  --test-incorrect-bg: #47233d;
}

.test-question-header, .test-result-header {
  color: #fff8ff;
  border: 1px solid #996be2;
  border-radius: 26px;
  background:
    radial-gradient(ellipse at 96% 0%, #1baba779, transparent 56%),
    linear-gradient(118deg, #2d154f, #4c218b 60%, #442d84);
  box-shadow: 0 14px 36px #47208628;
}

.wrap#main.test-map-screen { max-width: none; padding: 0; }

.test-map-board {
  --map-ink: #1b413d;
  --map-muted: #335b53;
  --map-water: #87cfc3;
  --map-water-edge: #daf4e7;
  --map-land: #bce7d1;
  --map-land-edge: #92c9ae;
  --map-machine: #386e63;
  --map-metal: #e6efc5;
  --map-rock: #d1c095;
  --map-strata: #8e815f;
  --map-crystal: #8e67b5;
  --map-crystal-light: #d7c3ee;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  min-height: calc(100svh - 58px);
  padding: 0 0 calc(90px + env(safe-area-inset-bottom, 0px));
  background:
    radial-gradient(ellipse at 97% 20%, var(--test-map-slope), transparent 62%),
    radial-gradient(ellipse at 0 78%, var(--test-map-slope), transparent 64%),
    var(--test-map-ground);
}

:root[data-theme=dark] .test-map-board {
  --map-ink: #f2f9ec;
  --map-muted: #c3e1d6;
  --map-water: #367980;
  --map-water-edge: #5f9b95;
  --map-land: #294d49;
  --map-land-edge: #456f60;
  --map-machine: #88bbaa;
  --map-metal: #3f6861;
  --map-rock: #746449;
  --map-strata: #c6ad7b;
  --map-crystal: #aa86d0;
  --map-crystal-light: #e0c8f2;
}

.test-map-intro {
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(220px,35%);
  align-items: center;
  gap: 16px;
  margin-inline: auto;
  padding: 10px clamp(20px,5vw,57px);
  max-width: 1120px;
  min-height: 215px;
  color: var(--map-ink);
}

.test-route-header .screen-header { margin: 0 0 13px; }
.test-route-header .screen-header h1 { margin-bottom: 6px; }
.test-route-header .screen-header p { max-width: 43ch; color: var(--map-muted); }
.test-route-summary {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 2px 10px;
  padding: 6px 11px;
  border: 1px solid var(--map-land-edge);
  border-radius: 99px;
  background: var(--paper);
  color: var(--map-ink);
}
.test-route-summary strong { color: var(--test-correct); font-size: 1.13rem; line-height: 1.1; white-space: nowrap; }
.test-route-summary span { font-size: .8rem; font-weight: 700; }
.test-route-next { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 9px; }
.test-route-next p { margin: 0; color: var(--map-muted); font-size: .86rem; font-weight: 650; }
.test-route-next .btn { min-height: 36px; padding: 5px 9px; }

.test-map-intro .mascot {
  grid-template-rows: minmax(0,1fr);
  width: 100%;
  height: clamp(181px,22vw,254px);
}

.test-map-trail { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; pointer-events: none; }
.test-map-list { list-style: none; max-width: 920px; margin: 0 auto; padding: 0 20px 15px; }
.test-stop { --node-x: 28%; --node-size: 65px; }
.test-stop:nth-child(7n + 2) { --node-x: 69%; }
.test-stop:nth-child(7n + 3) { --node-x: 78%; }
.test-stop:nth-child(7n + 4) { --node-x: 48%; }
.test-stop:nth-child(7n + 5) { --node-x: 22%; }
.test-stop:nth-child(7n + 6) { --node-x: 41%; }
.test-stop:nth-child(7n + 7) { --node-x: 68%; }

.test-stop-action {
  all: unset;
  box-sizing: border-box;
  width: 100%;
  min-height: 126px;
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(112px,30%) minmax(0,1fr);
  align-items: center;
  gap: 8px;
  color: var(--ink);
  cursor: pointer;
}

.test-stop-action:disabled { cursor: default; opacity: 1; }
.test-stop-action:focus-visible { outline: 3px solid var(--test-ready); outline-offset: 0; border-radius: 16px; }
.test-stop-marker {
  grid-area: 1 / 2;
  display: grid;
  place-items: center;
  position: relative;
  left: clamp(calc(var(--node-size) / 2),var(--node-x),calc(100% - var(--node-size) / 2));
  transform: translateX(-50%);
  width: var(--node-size);
  aspect-ratio: 1;
  border: 2px solid #9bbfbc;
  border-radius: 39% 45% 38% 41%;
  background: linear-gradient(143deg, #f8fffb, #cfe5e2);
  color: #50716d;
  box-shadow: 0 5px 0 #779d9b, 0 8px 18px #225c5530;
  font-size: 1.9rem;
  line-height: 1;
  font-weight: 850;
}

.test-stop[data-state="ready"] .test-stop-marker {
  border-color: #dbbcff;
  color: #fff;
  background: linear-gradient(145deg, #a86ae9, #5f2ab6 65%);
  box-shadow: 0 5px 0 #47217f, 0 0 0 5px #995ce638, 0 9px 22px #5c2aa746;
  padding-bottom: .12em;
  font-size: 2.25rem;
}

.test-stop[data-state="passed"] .test-stop-marker {
  border-color: #f5fff6;
  color: #12574c;
  background: linear-gradient(145deg, #d9fff0, #70dfb9);
  box-shadow: 0 5px 0 #389884, 0 8px 18px #225c5530;
}

.test-stop[data-state="locked"] .test-stop-marker::before {
  content: "";
  width: 17px;
  height: 14px;
  margin-top: 6px;
  border-radius: 4px;
  background: currentColor;
}
.test-stop[data-state="locked"] .test-stop-marker::after {
  content: "";
  position: absolute;
  width: 11px;
  height: 10px;
  top: calc(50% - 11px);
  border: 2px solid currentColor;
  border-radius: 7px 7px 0 0;
}
.test-stop[data-state="waiting"] .test-stop-marker::before {
  content: "";
  width: 22px;
  height: 22px;
  border: 2px solid currentColor;
  border-radius: 50%;
}
.test-stop[data-state="waiting"] .test-stop-marker::after {
  content: "";
  position: absolute;
  width: 7px;
  height: 7px;
  left: calc(50% - 1px);
  bottom: calc(50% - 1px);
  border-bottom: 2px solid currentColor;
  border-left: 2px solid currentColor;
}

.test-stop-info {
  grid-area: 1 / 3;
  display: grid;
  gap: 4px;
  width: min(100%,222px);
  min-width: 0;
  padding: 10px 12px;
  border-radius: 15px;
  border: 1px solid var(--line);
  background: var(--paper);
  box-shadow: 0 4px 12px #275c5520;
  overflow-wrap: anywhere;
}
.test-stop:nth-child(even) .test-stop-info { grid-column: 1; justify-self: end; text-align: right; }
.test-stop-meta { color: var(--muted); font-size: .75rem; font-weight: 700; line-height: 1.25; }
.test-stop-title { font-size: clamp(.94rem,2vw,1.09rem); line-height: 1.18; font-weight: 780; }
.test-stop-state { color: var(--test-locked); font-size: .82rem; line-height: 1.25; font-weight: 720; }
.test-stop[data-state="ready"] .test-stop-info { border-color: var(--test-ready); }
.test-stop[data-state="ready"] .test-stop-state { color: var(--test-ready); }
.test-stop[data-state="passed"] .test-stop-state { color: var(--test-correct); }
.test-stop-action:hover:not(:disabled) .test-stop-info { background: var(--accent-2); }

.test-quiz, .test-results { max-width: 780px; margin-inline: auto; }
.test-question-header { padding: clamp(15px,3.5vw,28px); margin-bottom: 16px; }
.test-question-nav { display: flex; align-items: center; justify-content: space-between; gap: 9px; }
.test-back { flex: 0 1 auto; }
.test-back::before { content: "←"; margin-inline-end: .45em; }
.test-question-step { color: #f6e9ff; font-size: .9rem; font-weight: 700; text-align: right; }
.test-question-progress { display: flex; gap: 5px; margin: 17px 0 12px; }
.test-question-progress span { flex: 1; height: 8px; border-radius: 8px; background: #eddcff40; }
.test-question-progress [data-state="current"] { background: #e5c2ff; }
.test-question-progress [data-state="correct"] { background: #98ffda; }
.test-question-progress [data-state="incorrect"] { background: #ffb5d2; }
.test-question-topic { margin: 0; color: #f2ddff; font-size: .94rem; line-height: 1.35; font-weight: 730; }
.test-question { padding: clamp(17px,4vw,33px); }
.test-question h1 { margin: 0 0 11px; font-size: clamp(1.4rem,4.4vw,2.13rem); line-height: 1.2; letter-spacing: -.032em; }
.test-question .answers { margin-top: 18px; }
.test-question .option {
  align-items: center;
  min-height: 55px;
  gap: 12px;
  padding: 10px 13px;
  border-width: 2px;
  border-radius: 14px;
  cursor: pointer;
}
.test-question .option:hover:not(:has(:disabled)) { border-color: var(--accent); }
.test-question .option input { width: 19px; height: 19px; margin: 0; }
.test-question .option:has(:disabled) { cursor: default; }
.test-question .option[data-feedback="correct"] { border-color: var(--test-correct); background: var(--test-correct-bg); }
.test-question .option[data-feedback="incorrect"] { border-color: var(--test-incorrect); background: var(--test-incorrect-bg); }
.test-question .option[data-feedback]::after { margin-inline-start: auto; color: var(--test-correct); font-weight: 900; content: "✓"; }
.test-question .option[data-feedback="incorrect"]::after { color: var(--test-incorrect); content: "×"; }
.test-question .field { min-height: 51px; margin-top: 5px; border-width: 2px; border-radius: 13px; }
.test-question .field:focus { border-color: var(--accent); }
.test-question .order-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; counter-reset: test-order; }
.test-question .order-list li {
  display: grid;
  grid-template-columns: auto minmax(0,1fr) auto;
  align-items: center;
  gap: 8px;
  padding: 7px 9px;
  border: 2px solid var(--line);
  border-radius: 13px;
  counter-increment: test-order;
}
.test-question .order-list li::before {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  content: counter(test-order);
  color: var(--accent);
  background: var(--accent-2);
  border-radius: 50%;
  font-size: .75rem;
  font-weight: 750;
}
.test-order-tools { display: flex; gap: 4px; }
.test-order-tools .btn { width: 42px; min-height: 44px; margin: 0; font-size: 1.14rem; }
.test-question button[type="submit"] { width: 100%; min-height: 51px; border-radius: 14px; }
.test-question .review, .test-review-list .review { padding: 14px; border-radius: 14px; }
.test-question .correct-note, .test-review-list .correct-note { background: var(--test-correct-bg); border-inline-start: 4px solid var(--test-correct); }
.test-question .wrong-note, .test-review-list .wrong-note { background: var(--test-incorrect-bg); border-inline-start: 4px solid var(--test-incorrect); }
.test-question .correct-note strong, .test-review-list .correct-note strong { color: var(--test-correct); }
.test-question .wrong-note strong, .test-review-list .wrong-note strong { color: var(--test-incorrect); }

.test-result-header { display: flex; align-items: center; gap: clamp(13px,4vw,29px); padding: clamp(16px,4vw,32px); }
.test-result-copy h1 { margin: 5px 0; font-size: clamp(1.42rem,5vw,2.42rem); letter-spacing: -.05em; line-height: 1.08; }
.test-result-copy p { margin: 5px 0; color: #f5e7ff; line-height: 1.35; }
.test-result-copy .btn { margin-top: 9px; background: #c2ffea; border-color: #c2ffea; color: #182e3c; }
.test-score {
  --score-color: #a1ffdf;
  display: grid;
  place-items: center;
  width: clamp(79px,20vw,138px);
  flex: 0 0 auto;
  aspect-ratio: 1;
  border-radius: 50%;
  background: conic-gradient(var(--score-color) var(--score),#eadcff35 0);
}
.test-score strong {
  display: grid;
  place-items: center;
  width: 84%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: #321a62;
  font-size: clamp(1.35rem,5vw,2.35rem);
  letter-spacing: -.05em;
}
.test-result-header[data-result="retry"] .test-score { --score-color: #ffc0d9; }
.test-review-list { margin-top: 22px; }
.test-review-list h2 { margin: 0 0 10px; font-size: 1.3rem; }

@media (max-width: 720px) {
  .test-map-intro {
    grid-template-columns: minmax(0,1fr) minmax(108px,39%);
    padding: 9px 15px 6px;
    min-height: 157px;
    gap: 2px;
  }
  .test-map-intro .mascot { height: clamp(136px,36vw,181px); }
  .test-map-intro .mascot-poster { width: min(78px,100%); }
}

@media (max-width: 510px) {
  .test-route-header .screen-header { margin-bottom: 8px; }
  .test-route-header .screen-header p { font-size: .85rem; line-height: 1.38; }
  .test-route-summary { padding: 4px 8px; gap: 2px 6px; }
  .test-route-summary strong { font-size: 1rem; }
  .test-route-summary span { font-size: .72rem; }
  .test-map-list { padding: 5px 13px 10px; }
  .test-stop { --node-size: 51px; }
  .test-stop-action { grid-template-columns: minmax(77px,36%) minmax(0,1fr); min-height: 102px; gap: 5px; }
  .test-stop-marker { grid-column: 1; }
  .test-stop .test-stop-info, .test-stop:nth-child(even) .test-stop-info { grid-column: 2; justify-self: stretch; text-align: left; width: 100%; }
  .test-stop-info { padding: 8px 9px; }
  .test-question .option { gap: 8px; padding-inline: 8px; }
  .test-order-tools .btn { width: 37px; }
}

:root { font-family: Arial, "Segoe UI", sans-serif; }
.screen-header h1, .setup h1, .hero h1, .test-question h1 { letter-spacing: -.025em; }
.course-screen { display: grid; gap: 22px; }
.course-overview {
  display: flex;
  justify-content: space-between;
  gap: 24px;
  padding: clamp(20px,4.5vw,36px);
  border-radius: 20px;
  border: 1px solid var(--line);
  background: var(--paper);
  border-top: 5px solid var(--accent);
}
.course-overview-copy { max-width: 530px; }
.course-overview h1 {
  margin: 0 0 12px;
  font-size: clamp(1.8rem,4vw,2.65rem);
  letter-spacing: -.025em;
  line-height: 1.14;
}
.course-overview-copy p, .course-module-header p, .course-outcome { margin: 0; line-height: 1.52; }
.course-overview-copy p { color: var(--muted); }
.course-controls { display: grid; align-content: start; gap: 10px; min-width: 150px; }
.course-controls .field { min-height: 42px; }
.course-status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .88rem; color: var(--muted); }
.course-status strong { color: var(--accent); font-size: 1.14rem; white-space: nowrap; }
.course-module {
  border: 1px solid var(--line);
  border-radius: 17px;
  background: var(--paper);
  overflow: hidden;
}
.course-module-header {
  display: flex;
  align-items: start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px 18px;
  background: var(--accent-2);
  padding: 18px clamp(14px,3vw,23px);
}
.course-module-header h2 { margin: 4px 0 6px; font-size: 1.35rem; }
.course-module-label { font-size: .82rem; color: var(--accent); font-weight: 700; }
.course-days { margin: 0; padding: 0; list-style: none; }
.course-day {
  display: grid;
  grid-template-columns: max(80px,14%) minmax(0,1fr);
  gap: 8px 14px;
  padding: 17px clamp(14px,3vw,23px);
}
.course-day + .course-day { border-top: 1px solid var(--line); }
.course-day-time { display: grid; align-content: start; gap: 5px; font-size: .92rem; }
.course-day-time time { color: var(--muted); }
.course-day-heading { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 9px; }
.course-day-heading h3 { margin: 0; font-size: 1.13rem; }
.course-meta { font-size: .86rem; margin: 5px 0; }
.course-complete { border-radius: 10px; padding: 4px 8px; background: var(--ok-bg); color: var(--ok); font-weight: 700; }
.course-actions.actions { margin: 10px 0 5px; }
.course-actions .btn { min-height: 37px; padding: 6px 10px; font-size: .88rem; font-weight: 600; }
.course-day .hint { margin: 4px 0 0; }
.lesson-sources { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 13px; }
.book-source { color: var(--accent); font-size: .86rem; font-weight: 600; text-decoration: underline; text-underline-offset: .18em; }
.book-chapter-context { margin: 0 0 12px; }
.book-chapter-context p { margin: 0 0 5px; }
.source-page-note { margin: 0 0 12px; }
.question-source { margin-top: 12px; }
.book-formulas { display: grid; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.book-formulas h3, .formula-card p { margin: 0; }
.formula-card { display: grid; gap: 8px; background: var(--bg); border-radius: 10px; padding: 14px; line-height: 1.45; }
.formula-equation { font: 700 clamp(1rem,4vw,1.3rem)/1.4 "Cambria Math", "Times New Roman", serif; overflow-wrap: anywhere; }
.formula-symbols { display: grid; grid-template-columns: fit-content(35%) 1fr; gap: 4px 12px; margin: 0; }
.formula-symbols dt { font-weight: 700; overflow-wrap: anywhere; }
.formula-symbols dd { margin: 0; }
.formula-example { font-weight: 600; }
.test-route-header .book-source { color: inherit; }
.test-route-header .lesson-sources { margin-top: 8px; }
@media (max-width: 590px) {
  .course-overview { display: grid; gap: 14px; }
  .course-controls { grid-template-columns: minmax(0,1fr) minmax(0,1fr); align-items: end; }
  .course-day { grid-template-columns: minmax(0,1fr); }
  .course-day-time { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
}
</style>

pressure is 27 MPa and formation pressure is 22 MPa. Find borehole minus formation pressure in MPa."],"key":5,"help":["Δp = 27 − 22 = 5 МПа.","Δp = 27 − 22 = 5 МПа.","Δp = 27 − 22 = 5 MPa."],"drill":true,"id":"conditions-case1","unit":"conditions"},{"type":"numeric","page":90,"prompt":["Гидростатическое давление в стволе 21 МПа, а пластовое 23 МПа. Найди Δp = pств − pпл в МПа. Сохрани знак.","Ұңғымадағы гидростатикалық қысым 21 МПа, қабатта 23 МПа. Δp айырмасын МПа-мен, таңбасымен тап.","Hydrostatic borehole pressure is 21 MPa and formation pressure is 23 MPa. Find borehole minus formation pressure in MPa, including the sign."],"key":-2,"help":["Δp = 21 − 23 = −2 МПа. Пластовое давление выше давления в стволе.","Δp = 21 − 23 = −2 МПа. Қабат қысымы ұңғымадағыдан жоғары.","Δp = 21 − 23 = −2 MPa. Formation pressure exceeds borehole pressure."],"unit":"conditions","id":"final-case0"}]},{"id":"logs","book":"lat","pages":"92–95","title":["Читаем каротаж","Каротажды оқимыз","Read well logs"],"facts":[{"page":92,"term":["Глинистость","Саздылық","Clay content"],"quiz":["Что помогает различать метод СП в терригенном разрезе?","Терригендік қимада ӨП әдісі нені ажыратуға көмектеседі?","What can spontaneous potential help distinguish in a terrigenous section?"],"explanation":["В описанных условиях СП помогает различать породы по относительной глинистости.","Сипатталған жағдайда ӨП тау жыныстарын салыстырмалы саздылығы бойынша ажыратуға көмектеседі.","In the stated conditions, spontaneous potential helps distinguish rocks by relative clay content."],"plain":["Кривая СП на диаграмме помогает сравнить слои в скважине. В условиях этого примера по ней можно понять, какой слой более глинистый.","Диаграммадағы ӨП қисығы ұңғымадағы қабаттарды салыстыруға көмектеседі. Осы мысалда қисыққа қарап, қай қабатта саз көбірек екенін анықтауға болады.","The SP line on the log helps compare layers in the well. In this example, it gives a clue about which layer contains more clay."]},{"page":93,"term":["Комплекс методов","Әдістер кешені","Multiple logging methods"],"quiz":["Как использовать таблицу признаков пород, если отдельная кривая неоднозначна?","Бір қисық анық жауап бермесе, жыныс белгілерінің кестесін қалай қолданамыз?","How should you use the rock indicator table when one curve is ambiguous?"],"explanation":["В таблице сопоставлены признаки нескольких методов. Сравнение показаний даёт больше оснований для вывода о породе.","Кестеде бірнеше әдістің белгілері берілген. Оларды салыстыру жыныс туралы қорытындыны негіздеуге көмектеседі.","The table compares indicators from several methods. Use the readings together to interpret the rock."],"plain":["Если по одной кривой непонятно, какая перед нами порода, посмотри на показания других методов на той же глубине. Затем сравни их с признаками в таблице.","Бір қисықтан жыныс түрі анық болмаса, сол тереңдіктегі басқа әдістердің көрсеткіштерін қара. Содан кейін оларды кестедегі белгілермен салыстыр.","If one curve leaves the rock type unclear, check what the other methods show at the same depth. Then compare the readings with the clues in the table."],"scene":"logs"},{"page":95,"term":["Глинистый материал","Сазды материал","Clay material"],"quiz":["Что в породе, согласно тексту, способно изменить показания нескольких методов и усложнить выделение коллектора?","Мәтін бойынша жыныстағы не бірнеше әдістің көрсеткішін өзгертіп, коллекторды ажыратуды қиындатады?","What material can change several log responses and make reservoir identification harder?"],"explanation":["При большом содержании глинистого материала могут резко меняться показания разных методов.","Сазды материал көп болса, әртүрлі әдістердің көрсеткіштері едәуір өзгеруі мүмкін.","High clay content can substantially change the responses of different methods."],"plain":["Большое количество глины в породе может изменить сразу несколько кривых на диаграмме. Учитывай глину, когда ищешь слой, способный вмещать и пропускать жидкость.","Жыныста саз көп болса, диаграммадағы бірнеше қисық қатар өзгеруі мүмкін. Сұйықтықты сақтап, өткізе алатын қабатты іздегенде осыны ескер.","Lots of clay can change several curves on the log at once. Keep this in mind when looking for a layer that can hold and transmit fluid."]}],"order":[["Посмотри кривые","Қисықтарды қара","Inspect the curves"],["Сопоставь признаки нескольких методов","Бірнеше әдістің белгілерін салыстыр","Compare indicators across methods"],["Сформулируй вывод о породе","Жыныс туралы қорытынды жаса","Draw a conclusion about the rock"]],"chapter":"V · §19","minutes":28,"outcome":["Сопоставить СП, гамма-каротаж и сопротивление на одной глубине.","Бір тереңдіктегі ӨП, гамма-каротаж және кедергіні салыстыру.","Compare SP, gamma ray and resistivity at a common depth."],"formulas":[{"page":93,"equation":"Δz = z₂ − z₁","use":["Используйте общую шкалу глубины, прежде чем сравнивать признаки на диаграммах.","Қисықтарды салыстырмас бұрын ортақ тереңдік шкаласын қолданыңыз.","Use a shared depth scale before comparing log responses."],"symbols":[{"name":"z₁, z₂","description":["глубины двух отметок, м","екі белгі тереңдігі, м","depths of the two marks, m"]},{"name":"Δz","description":["разность глубин, м","тереңдік айырмасы, м","depth difference, m"]}],"example":["Пример: между 1010 и 1016 м разность 6 м по шкале глубины.","Мысал: 1010 және 1016 м арасында 6 м.","Example: 1010 and 1016 m are 6 m apart on the depth scale."],"application":true}],"questions":[{"id":"logs-q0","page":92,"prompt":["Что помогает различать метод СП в терригенном разрезе?","Терригендік қимада ӨП әдісі нені ажыратуға көмектеседі?","What can spontaneous potential help distinguish in a terrigenous section?"],"help":["В описанных условиях СП помогает различать породы по относительной глинистости.","Сипатталған жағдайда ӨП тау жыныстарын салыстырмалы саздылығы бойынша ажыратуға көмектеседі.","In the stated conditions, spontaneous potential helps distinguish rocks by relative clay content."],"unit":"logs","type":"si  породе.","Кестеде бірнеше әдістің белгілері берілген. Оларды салыстыру жыныс туралы қорытындыны негіздеуге көмектеседі.","The table compares indicators from several methods. Use the readings together to interpret the rock."],"unit":"logs","type":"blank","key":["Комплекс методов","Әдістер кешені","Multiple logging methods"]},{"id":"logs-q2","page":95,"prompt":["Что в породе, согласно тексту, способно изменить показания нескольких методов и усложнить выделение коллектора?","Мәтін бойынша жыныстағы не бірнеше әдістің көрсеткішін өзгертіп, коллекторды ажыратуды қиындатады?","What material can change several log responses and make reservoir identification harder?"],"help":["При большом содержании глинистого материала могут резко меняться показания разных методов.","Сазды материал көп болса, әртүрлі әдістердің көрсеткіштері едәуір өзгеруі мүмкін.","High clay content can substantially change the responses of different methods."],"unit":"logs","type":"single","options":[["Комплекс методов","Әдістер кешені","Multiple logging methods"],["Глинистость","Саздылық","Clay content"],["Глинистый материал","Сазды материал","Clay material"]],"key":2},{"id":"logs-write2","page":95,"prompt":["Что в породе, согласно тексту, способно изменить показания нескольких методов и усложнить выделение коллектора?","Мәтін бойынша жыныстағы не бірнеше әдістің көрсеткішін өзгертіп, коллекторды ажыратуды қиындатады?","What material can change several log responses and make reservoir identification harder?"],"help":["При большом содержании глинистого материала могут резко меняться показания разных методов.","Сазды материал көп болса, әртүрлі әдістердің көрсеткіштері едәуір өзгеруі мүмкін.","High clay content can substantially change the responses of different methods."],"unit":"logs","type":"blank","key":["Глинистый материал","Сазды материал","Clay material"]},{"type":"single","page":93,"prompt":["У двух терригенных интервалов одинаковое сопротивление. Какие данные помогут сравнить их относительную глинистость?","Екі терригендік аралықтың кедергісі бірдей. Салыстырмалы саздылықты қандай дерекпен салыстыруға болады?","Two terrigenous intervals have the same resistivity. Which data can help compare their relative clay content?"],"options":[["Гамма-каротаж и отклонение СП от линии глин на тех же глубинах","Сол тереңдіктердегі гамма-каротаж және ӨП-нің саз сызығынан ауытқуы","Gamma ray and SP deviation from the shale baseline at the same depths"],["Среднее давление по всей скважине","Ұңғыма бойындағы орташа қысым","Mean pressure across the well"],["Дебит удалённой скважины","Алыстағы ұңғыманың дебиті","Flow rate of a distant well"]],"key":0,"help":["ГК и СП дают независимые признаки глинистости при подходящих условиях. Кривые сравнивают на общей шкале глубины.","Қолайлы жағдайда ГК және ӨП саздылықтың бөлек белгілерін береді. Қисықтарды ортақ тереңдік шкаласында салыстырады.","Gamma ray and SP provide complementary clay indicators under suitable conditions. Compare them on a shared depth scale."],"id":"logs-case0","unit":"logs"},{"type":"single","page":95,"prompt":["Глинистый песчаник отклоняется от отклика чистого песчаника по нескольким кривым. Что следует учесть при выделении коллектора?","Сазды құмтас бірнеше қисықта таза құмтастан ерекшеленеді. Коллекторды бөлгенде нені ескеру керек?","A shaly sandstone differs from clean sandstone on several logs. What should reservoir interpretation account for?"],"options":[["Только общую глубину скважины","Ұңғыманың жалпы тереңдігін ғана","Only the total well depth"],["Влияние глины на отклик каждого использованного метода","Саздың әр қолданылған әдістің көрсетуіне әсерін","Clay effects on the response of each method used"],["Только плотность пластовой воды","Қабат суының тығыздығын ғана","Only formation-water density"]],"key":1,"help":["Глинистость меняет отклик комплекса ГИС. Критерии для чистого песчаника могут дать ошибку.","Саздылық ГИС кешенінің көрсетуін өзгертеді. Таза құмтас критерийлері қате беруі мүмкін.","Clay changes multiple log responses. Cut-offs for clean sandstone can misclassify the interval."],"drill":true,"id":"logs-case1","unit":"logs"}]},{"id":"saturation","book":"lat","pages":"96–101","title":["Насыщение коллектора","Коллектордың қанығуы","Reservoir saturation"],"facts":[{"page":97,"term":["Пористость или глинистость","Кеуектілік немесе саздылық","Porosity or clay content"],"quiz":["Какие два вида методов автор предлагает для оценки эффективной толщины?","Автор тиімді қалыңдықты бағалау үшін қандай екі әдіс тобын ұсынады?","Which two kinds of methods are proposed for estimating effective thickness?"],"explanation":["Автор рассматривает методы пористости и методы глинистости как два пути оценки эффективной толщины.","Автор тиімді қалыңдықты бағалаудың екі жолы ретінде кеуектілік пен саздылық әдістерін қарастырады.","The author presents porosity and clay-content methods as two ways to estimate effective thickness."],"plain":["Нужно понять, какая часть слоя входит в полезную толщину коллектора. Автор предлагает два подхода: смотреть на количество пустот в породе или на содержание глины.","Қабаттың қай бөлігі коллектордың тиімді қалыңдығына кіретінін анықтау керек. Автор екі жол ұсынады: жыныстағы қуыстардың үлесіне немесе саз мөлшеріне қарау.","To estimate how much of the layer counts as useful reservoir, the author offers two approaches: look at the amount of pore space or look at the amount of clay."]},{"page":100,"term":["Нефть с небольшим количеством воды","Аз мөлшерде суы бар мұнай","Oil with a small amount of water"],"quiz":["Какой результат соответствует Рн = 7 в примере 50 для αСП = 1?","αӨП = 1 болғанда, 50-мысалдағы Рн = 7 мәніне қандай нәтиже сәйкес келеді?","What outcome corresponds to Rn = 7 in Example 50 when αSP = 1?"],"explanation":["В примере 50 для чистого коллектора при Рн = 7 указана нефть с небольшим количеством воды. Это вывод для данной кривой.","50-мысалда таза коллектор үшін Рн = 7 мәніне аз мөлшерде суы бар мұнай сәйкес келеді. Бұл осы қисыққа қатысты.","For the clean reservoir in Example 50, Rn = 7 corresponds to oil with a small amount of water. This is specific to the stated curve."],"plain":["В примере 50 находим Рн = 7 на кривой именно для чистого коллектора. В этой точке книга указывает нефть и немного воды. Для другой кривой вывод нужно проверить заново.","50-мысалда таза коллекторға арналған қисықтан Рн = 7 мәнін табамыз. Осы нүктеде кітап мұнай мен аздаған суды көрсетеді. Қисық басқа болса, қорытындыны қайта тексеру керек.","In Example 50, find Rn = 7 on the curve for the clean reservoir. At that point, the book shows oil with a little water. Check the interpretation again if you use a different curve."]},{"page":98,"term":["Безводная нефть","Сусыз мұнай","Water-free oil"],"quiz":["Какой характер притока указан в примере 46 для сопротивления пласта 20 Ом·м?","46-мысалда қабат кедергісі 20 Ом·м болса, қандай ағын көрсетілген?","What type of inflow does Example 46 associate with a formation resistivity of 20 Ω·m?"],"explanation":["По данной палетке при сопротивлении 20 Ом·м и пористости 25% прогнозируют приток безводной нефти.","Берілген палеткада 20 Ом·м кедергі мен 25% кеуектілік сусыз мұнай ағынына сәйкес келеді.","On this chart, 20 Ω·m and 25% porosity indicate water-free oil inflow."],"plain":["Палетка в примере показывает, что из пласта должна поступать нефть без воды. Часть воды может оставаться в порах.","Мысалдағы палетка қабаттан сусыз мұнай келетінін көрсетеді. Судың бір бөлігі қуыстарда қалуы мүмкін.","On this example chart, the predicted oil inflow is water-free. Some water can still remain in the pores."],"id":"water-free"}],"order":[["Учти тип коллектора","Коллектор түрін ескер","Identify the reservoir type"],["Выбери подходящую кривую","Сәйкес қисықты таңда","Choose the applicable curve"],["Оцени насыщение по данным","Деректер бойынша қанығуды бағала","Interpret saturation from the data"]],"chapter":"V · §20","minutes":28,"outcome":["Применить палетку с учётом свойств и условий пласта.","Қабат қасиеттері мен жағдайын ескере отырып палетканы қолдану.","Apply a chart with its reservoir-specific assumptions."],"formulas":[{"page":98,"equation":"Sв = Vводы / Vпор","use":["Это определение водонасыщенности. На палетке книги может быть относительная водонасыщенность с другой нормировкой.","Бұл суға қанығудың анықтамасы. Кітап палеткасында басқа нормалау болуы мүмкін.","This defines water saturation. The book’s chart can use a differently normalized relative saturation."],"symbols":[{"name":"Sв","description":["доля пор, занятая водой","су алған қуыс үлесі","fraction of pore volume filled with water"]},{"name":"Vводы","description":["объём воды, м³","су көлемі, м³","volume of water, m³"]},{"name":"Vпор","description":["общий объём пор, м³","қуыстардың жалпы көлемі, м³","total pore volume, m³"]}],"example":["Пример: 3/10 = 0,30, или 30%.","Мысал: 3/10 = 0,30, яғни 30%.","Example: 3/10 = 0.30, or 30%."],"application":true}],"questions":[{"id":"saturation-q0","page":97,"prompt":["Какие два вида методов автор предлагает для оценки эффективной толщины?","Автор тиімді қалыңдықты бағалау үшін қандай екі әдіс тобын ұсынады?","Which two kinds of methods are proposed for estimating effective thickness?"],"help":["Автор рассматривает методы пористости и методы глинистости как два пути оценки эффективной толщины.","Автор тиімді қалыңдықты бағалаудың екі жолы ретінде кеуектілік пен саздылық әдістерін қарастырады.","The author presents porosity and clay-content methods as two ways to estimate effective thickness."],"unit":"saturation","type":"single","options":[["Безводная нефть","Сусыз мұнай","Water-free oil"],["Нефть с небольшим количеством воды","Аз мөлшерде суы бар мұнай","Oil with a small amount of water"],["Пористость или глинистость","Кеуектілік немесе саздылық","Porosity or clay content"]],"key":2},{"id":"saturation-write0","page":97,"prompt":["Какие два вида методов автор предлагает для оценки эффективной толщины?","Автор тиімді қалыңдықты бағалау үш oir in Example 50, Rn = 7 corresponds to oil with a small amount of water. This is specific to the stated curve."],"unit":"saturation","type":"blank","key":["Нефть с небольшим количеством воды","Аз мөлшерде суы бар мұнай","Oil with a small amount of water"]},{"id":"saturation-qwater-free","page":98,"prompt":["Какой характер притока указан в примере 46 для сопротивления пласта 20 Ом·м?","46-мысалда қабат кедергісі 20 Ом·м болса, қандай ағын көрсетілген?","What type of inflow does Example 46 associate with a formation resistivity of 20 Ω·m?"],"help":["По данной палетке при сопротивлении 20 Ом·м и пористости 25% прогнозируют приток безводной нефти.","Берілген палеткада 20 Ом·м кедергі мен 25% кеуектілік сусыз мұнай ағынына сәйкес келеді.","On this chart, 20 Ω·m and 25% porosity indicate water-free oil inflow."],"unit":"saturation","type":"single","options":[["Нефть с небольшим количеством воды","Аз мөлшерде суы бар мұнай","Oil with a small amount of water"],["Пористость или глинистость","Кеуектілік немесе саздылық","Porosity or clay content"],["Безводная нефть","Сусыз мұнай","Water-free oil"]],"key":2},{"id":"saturation-writewater-free","page":98,"prompt":["Какой характер притока указан в примере 46 для сопротивления пласта 20 Ом·м?","46-мысалда қабат кедергісі 20 Ом·м болса, қандай ағын көрсетілген?","What type of inflow does Example 46 associate with a formation resistivity of 20 Ω·m?"],"help":["По данной палетке при сопротивлении 20 Ом·м и пористости 25% прогнозируют приток безводной нефти.","Берілген палеткада 20 Ом·м кедергі мен 25% кеуектілік сусыз мұнай ағынына сәйкес келеді.","On this chart, 20 Ω·m and 25% porosity indicate water-free oil inflow."],"unit":"saturation","type":"blank","key":["Безводная нефть","Сусыз мұнай","Water-free oil"]},{"type":"single","page":100,"prompt":["В примере 50 график для чистого коллектора даёт нефть с небольшим количеством воды. Что нужно проверить перед применением результата к глинистому интервалу?","50-мысалда таза коллектор графигі аз суы бар мұнайды көрсетеді. Нәтижені сазды аралыққа қолданбас бұрын нені тексереміз?","Example 50 predicts oil with a little water for a clean reservoir. What should be checked before using that finding for a shaly interval?"],"options":[["Только толщину нефтеносного интервала","Мұнайлы аралықтың қалыңдығын ғана","Only the oil interval thickness"],["Соответствие палетки глинистости и условиям интервала","Палетканың аралық саздылығы мен жағдайына сәйкестігін","Whether the chart applies to the interval’s clay content and conditions"],["Только глубину кровли","Төбе тереңдігін ғана","Only the top depth"]],"key":1,"help":["Палетка связывает измерения с характеристиками конкретного коллектора. Глина может менять отклик.","Палетка өлшемдерді нақты коллектор қасиеттерімен байланыстырады. Саз аспап көрсетуін өзгерте алады.","The chart relates readings to a specific reservoir setting. Clay can change the response."],"id":"saturation-case0","unit":"saturation"},{"type":"numeric","page":98,"prompt":["Из 15 см³ пор 6 см³ занято водой. Какова водонасыщенность Sв в процентах?","15 см³ қуыстың 6 см³ бөлігін су алып жатыр. Суға қанығу неше пайыз?","Water fills 6 of 15 cm³ of pore volume. What is water saturation as a percentage?"],"key":40,"help":["Sв = 6 / 15 = 0,4 = 40%. В знаменателе объём пор.","Sсу = 6 / 15 = 0,4 = 40%. Бөлімде қуыс көлемі.","Sw = 6 / 15 = 0.4 = 40%. The denominator is pore volume."],"drill":true,"id":"saturation-case1","unit":"saturation"}]},{"id":"thickness","book":"lat","title":["Контакты и эффективная толщина","Жапсарлар және тиімді қалыңдық","Contacts and net thickness"],"facts":[{"page":101,"term":["Водонефтяной контакт","Су-мұнай жапсары","Oil–water contact"],"quiz":["Как называется граница нефтяной и водной частей залежи?","Кеннің мұнайлы және сулы бөліктерінің шекарасы қалай аталады?","What is the boundary between the oil and water portions called?"],"explanation":["При наличии переходной зоны нижнюю границу предельного нефтенасыщения и зеркало воды определяют отдельно.","Өтпелі аймақ болса, шекті мұнайға қанығудың төменгі шекарасы және су айнасы бөлек анықталады.","With a transition zone, the base of maximum oil saturation and the water level are identified separately."],"plain":["При наличии переходной зоны нижнюю границу предельного нефтенасыщения и зеркало воды определяют отдельно.","Өтпелі аймақ болса, шекті мұнайға қанығудың төменгі шекарасы және су айнасы бөлек анықталады.","With a transition zone, the base of maximum oil saturation and the water level are identified separately."]},{"page":104,"term":["Эффективная толщина","Тиімді қалыңдық","Net thickness"],"quiz":["Как называется сумма мощностей интервалов, удовлетворяющих выбранным критериям коллектора?","Коллектор талаптарына сай аралықтардың қосынды қалыңдығы қалай аталады?","What is the summed thickness of intervals meeting the reservoir criteria called?"],"explanation":["Эффективная толщина зависит от того, какие прослои включены. Глину и плотные непроницаемые интервалы не прибавляют.","Тиімді қалыңдыққа таңдалған аралықтар ғана кіреді. Саз бен тығыз өткізбейтін аралықтар қосылмайды.","Net thickness depends on the intervals included. Clay and tight impermeable beds are excluded."],"plain":["Эффективная толщина зависит от того, какие прослои включены. Глину и плотные непроницаемые интервалы не прибавляют.","Тиімді қалыңдыққа таңдалған аралықтар ғана кіреді. Саз бен тығыз өткізбейтін аралықтар қосылмайды.","Net thickness depends on the intervals included. Clay and tight impermeable beds are excluded."]},{"page":108,"term":["Критическая пористость","Шекті кеуектілік","Porosity cut-off"],"quiz":["Какой порог пористости отделяет коллектор от неколлектора в рассматриваемой классификации?","Коллекторды басқа жыныстан бөлетін кеуектілік шегі қалай аталады?","What porosity threshold separates reservoir from non-reservoir in this classification?"],"explanation":["Порог подбирают для изучаемых отложений. Перенос неподходящего значения меняет оценку эффективной толщины.","Шек зерттелетін шөгінділерге бейімделеді. Сәйкес емес шек тиімді қалыңдық бағасын өзгертеді.","A cut-off is calibrated for the formation. Applying the wrong value changes the net-thickness estimate."],"plain":["Порог подбирают для изучаемых отложений. Перенос неподходящего значения меняет оценку эффективной толщины.","Шек зерттелетін шөгінділерге бейімделеді. Сәйкес емес шек тиімді қалыңдық бағасын өзгертеді.","A cut-off is calibrated for the formation. Applying the wrong value changes the net-thickness estimate."]}],"chapter":"V · §20","pages":"101–108","minutes":25,"outcome":["Отобрать интервалы и вычислить эффективную толщину.","Аралықтарды таңдап тиімді қалыңдықты есептеу.","Select intervals and calculate net thickness."],"formulas":[{"page":104,"equation":"hэфф = Σ hᵢ","use":["Складывают толщины только тех интервалов, которые отвечают критерию.","Тек критерийге сай аралықтардың қалыңдығы қосылады.","Sum the thicknesses of only the intervals meeting the criterion."],"symbols":[{"name":"hэфф","description":["эффективная толщина, м","тиімді қалыңдық, м","net thickness, m"]},{"name":"hᵢ","description":["толщина принятого интервала, м","алынған аралық қалыңдығы, м","accepted interval thickness, m"]}],"example":["Пример: два принятых интервала по 5 и 8 м дают 13 м.","Мысал: 5 және 8 м аралықтар 13 м береді.","Example: accepted intervals of 5 and 8 m give 13 m."],"application":true}],"questions":[{"id":"thickness-q0","page":101,"prompt":["Как называется граница нефтяной и водной частей залежи?","Кеннің мұнайлы және сулы бөліктерінің шекарасы қалай аталады?","What is the boundary between the oil and water portions called?"],"help":["При наличии переходной зоны нижнюю границу предельного нефтенасыщения и зеркало воды определяют отдельно.","Өтпелі аймақ болса, шекті мұнайға қанығудың төменгі шекарасы және су айнасы бөлек анықталады.","With a transition zone, the base of maximum oil saturation and the water level are identified separately."],"unit":"th  intervals meeting the reservoir criteria called?"],"help":["Эффективная толщина зависит от того, какие прослои включены. Глину и плотные непроницаемые интервалы не прибавляют.","Тиімді қалыңдыққа таңдалған аралықтар ғана кіреді. Саз бен тығыз өткізбейтін аралықтар қосылмайды.","Net thickness depends on the intervals included. Clay and tight impermeable beds are excluded."],"unit":"thickness","type":"blank","key":["Эффективная толщина","Тиімді қалыңдық","Net thickness"]},{"id":"thickness-q2","page":108,"prompt":["Какой порог пористости отделяет коллектор от неколлектора в рассматриваемой классификации?","Коллекторды басқа жыныстан бөлетін кеуектілік шегі қалай аталады?","What porosity threshold separates reservoir from non-reservoir in this classification?"],"help":["Порог подбирают для изучаемых отложений. Перенос неподходящего значения меняет оценку эффективной толщины.","Шек зерттелетін шөгінділерге бейімделеді. Сәйкес емес шек тиімді қалыңдық бағасын өзгертеді.","A cut-off is calibrated for the formation. Applying the wrong value changes the net-thickness estimate."],"unit":"thickness","type":"single","options":[["Эффективная толщина","Тиімді қалыңдық","Net thickness"],["Водонефтяной контакт","Су-мұнай жапсары","Oil–water contact"],["Критическая пористость","Шекті кеуектілік","Porosity cut-off"]],"key":2},{"id":"thickness-write2","page":108,"prompt":["Какой порог пористости отделяет коллектор от неколлектора в рассматриваемой классификации?","Коллекторды басқа жыныстан бөлетін кеуектілік шегі қалай аталады?","What porosity threshold separates reservoir from non-reservoir in this classification?"],"help":["Порог подбирают для изучаемых отложений. Перенос неподходящего значения меняет оценку эффективной толщины.","Шек зерттелетін шөгінділерге бейімделеді. Сәйкес емес шек тиімді қалыңдық бағасын өзгертеді.","A cut-off is calibrated for the formation. Applying the wrong value changes the net-thickness estimate."],"unit":"thickness","type":"blank","key":["Критическая пористость","Шекті кеуектілік","Porosity cut-off"]},{"type":"single","page":108,"prompt":["Для данного разреза пористость 8% — нижняя граница коллектора. У двух одинаковых по толщине прослоев 6% и 10%. Какие включают в эффективную толщину при прочих выполненных критериях?","Бұл қимада кеуектілік шегі 8%. Қалыңдығы бірдей аралықтарда 6% және 10%. Басқа шарттар орындалса, тиімді қалыңдыққа қайсысы кіреді?","The locally calibrated porosity cut-off is 8%. Equal-thickness beds have 6% and 10% porosity. Which count toward net thickness if the other criteria are met?"],"options":[["Оба прослоя","Екеуі де","Both beds"],["Только 6%","Тек 6%","Only the 6% bed"],["Только 10%","Тек 10%","Only the 10% bed"]],"key":2,"help":["Порог применяют к каждому прослою. Прослой с 6% находится ниже 8%.","Шек әр аралыққа бөлек қолданылады. 6% аралық 8%-дан төмен.","Apply the cut-off separately to each bed. The 6% bed falls below 8%."],"id":"thickness-case0","unit":"thickness"},{"type":"numeric","page":104,"prompt":["В разрезе есть 7 м коллектора, 3 м глины и ещё 4 м коллектора. Найди эффективную толщину в метрах.","Қимада 7 м коллектор, 3 м саз және тағы 4 м коллектор бар. Тиімді қалыңдықты метрмен тап.","The interval contains 7 m of reservoir, 3 m of clay and another 4 m of reservoir. Find net thickness in metres."],"key":11,"help":["hэфф = 7 + 4 = 11 м. Глинистый прослой пропускаем.","hтиім = 7 + 4 = 11 м. Сазды аралық есептелмейді.","Net thickness is 7 + 4 = 11 m. Exclude the clay bed."],"drill":true,"id":"thickness-case1","unit":"thickness"},{"type":"numeric","page":104,"prompt":["Порог пористости 9%. Три прослоя толщиной 2, 4 и 5 м имеют пористость 12%, 7% и 10% соответственно. Какова эффективная толщина в метрах, если других ограничений нет?","Кеуектілік шегі 9%. 2, 4 және 5 м аралықтардың кеуектілігі тиісінше 12%, 7% және 10%. Басқа шек болмаса, тиімді қалыңдық неше метр?","The porosity cut-off is 9%. Beds 2, 4 and 5 m thick have porosities of 12%, 7% and 10%, respectively. What is net thickness in metres with no other constraints?"],"key":7,"help":["Порог проходят первый и третий прослои. Их сумма 2 + 5 = 7 м.","Бірінші және үшінші аралық шектен өтеді. Қосындысы 2 + 5 = 7 м.","The first and third beds pass the cut-off. Their total is 2 + 5 = 7 m."],"unit":"thickness","id":"final-case1"}]},{"id":"reef","book":"kuz","pages":"200–204","title":["Как устроен риф","Рифтің құрылысы","Reef architecture"],"facts":[{"page":200,"term":["Биостром","Биостром","Biostrome"],"quiz":["Как называется пласт или уплощённая линза из остатков организмов в прижизненном положении?","Тіршілік кезіндегі қалпында сақталған организм қалдықтарынан тұратын қабат не жалпақ линза қалай аталады?","What is a bed or flattened lens made of remains of organisms in growth position called?"],"explanation":["Биостром может иметь форму пласта или уплощённой линзы.","Биостром қабат немесе жалпақ линза түрінде болуы мүмкін.","A biostrome can take the shape of a bed or flattened lens."],"plain":["Представь широкое и тонкое тело из остатков организмов. Оно может выглядеть как слой или как линза, которая становится тоньше к краям.","Организм қалдықтарынан құралған жалпақ, жұқа денені елестет. Ол қабат сияқты немесе шеттеріне қарай жұқаратын линза тәрізді болуы мүмкін.","Picture a broad, thin body made of organism remains. It can look like a layer or like a lens that tapers towards the edges."],"scene":"lens"},{"page":203,"term":["Атолл","Атолл","Atoll"],"quiz":["У какого типа рифа породы ядра могут образовывать кольцо?","Рифтің қай түрінде ядро жыныстары сақина түзе алады?","In which reef form can core facies form a ring?"],"explanation":["В атоллах породы ядра могут располагаться кольцом или овалом по краю комплекса.","Атоллда ядро жыныстары кешеннің шетімен сақина не сопақша түзе орналасуы мүмкін.","Atoll core facies can form a ring or oval around the edge of the complex."],"plain":["Если смотреть на атолл сверху, основная часть рифа может выглядеть как кольцо или овал. Середина лежит внутри этого кольца.","Атоллға жоғарыдан қарасаң, рифтің негізгі бөлігі сақина немесе сопақша болып көрінуі мүмкін. Ортасы сол сақинаның ішінде қалады.","From above, the main reef zone of an atoll can look like a ring or an oval. The centre lies inside that ring."],"scene":"atoll"},{"page":204,"term":["Линейная зональность","Сызықтық белдемділік","Linear zonation"],"quiz":["Как обычно вытянуты фациальные зоны в описанной линейной рифовой системе?","Сипатталған сызықтық риф жүйесінде фациялық белдемдер қалай созылады?","How are facies zones arranged in the described elongated reef system?"],"explanation":["Зоны вытянуты вдоль простирания рифовой системы, параллельно друг другу.","Белдемдер риф жүйесінің созылымы бойымен бір-біріне параллель орналасады.","Zones extend parallel to the trend of the reef system."],"plain":["На плане зоны похожи на длинные полосы рядом друг с другом. Каждая полоса тянется вдоль рифа.","Планда белдемдер қатар жатқан ұзын жолақтарға ұқсайды. Әр жолақ рифтің бойымен созылады.","On a plan, the zones look like long strips next to one another. Each strip runs along the reef."],"scene":"zones"}],"order":[["Определи форму на плане","Пландағы пішінді анықта","Identify the plan shape"],["Сопоставь положение фаций","Фациялардың орнын салыстыр","Compare facies locations"],["Опиши строение рифа","Рифтің құрылысын сипатта","Describe the reef architecture"]],"chapter":"10 · §10.1","minutes":22,"outcome":["Отличить форму рифа на плане и разрезе.","Риф пішінін жоспар мен қимада салыстыру.","Distinguish reef shapes in plan and section."],"formulas":[{"page":203,"equation":"A ≈ π·a·b","use":["Оценка площади контура, если план рифа можно приблизить эллипсом. Это не расчёт запасов.","Риф жоспары эллипске жуық болса оның ауданын бағалайды. Бұл қор есебі емес.","Estimates the plan area if the outline can be approximated by an ellipse. It does not estimate reserves."],"symbols":[{"name":"A","description":["площадь контура, км²","контур ауданы, км²","outline area, km²"]},{"name":"a, b","description":["полуоси эллипса, км","эллипстің жарты осьтері, км","ellipse semi-axes, km"]}],"example":["Пример: при a = 2 км и b = 1 км площадь около 6,28 км².","Мысал: a = 2 км, b = 1 км болса ≈6,28 км².","Example: a = 2 km and b = 1 km give about 6.28 km²."],"application":true}],"questions":[{"id":"reef-q0","page":200,"prompt":["Как называется пласт или уплощённая линза из остатков организмов в прижизненном положении?","Тіршілік кезіндегі қалпында сақталған организм қалдықтарынан тұратын қабат не жалпақ линза қалай аталады?","What is a bed or flattened lens made of remains of organisms in growth position called?"],"help":["Биостром может иметь форму пласта или уплощённой линзы.","Биостром қабат немесе жалпақ линза түрінде болуы мүмкін.","A biostrome can take the shape of a bed or flattened lens."],"unit":"reef","type":"single","options":[["Линейная зональность","Сызықтық белдемділік","Linear zonation"],["Атолл","Атолл","Atoll"],["Биостром","Биостром","Biostrome"]],"key":2},{"id":"reef-write0","page":200,"prompt":["Как называется пласт или уплощённая линза из остатков организмов в прижизненном положении?","Тіршілік кезіндегі қалпында сақталған организм қалдықтарынан тұратын қабат не жалпақ линза қалай аталады?","What is a bed or flattened lens made of remains of organisms in growth position called?"],"help":["Биостром может иметь форму пласта или уплощённой линзы.","Биостром қабат немесе жалпақ линза түрінде болуы мүмкін.","A biostrome can take the shape of a bed or flattened lens."],"unit":"reef","type":"blank","key":["Биостром","Биостром","Biostrome"]},{"id":"reef-q1","page":203,"prompt":["У какого типа рифа породы ядра могут образовывать кольцо?","Рифтің қай түрінде ядро жыныстары сақина түзе алады?","In which reef form can core facies form a ring?"],"help":["В атоллах породы ядра могут располагаться кольцом или овалом по краю комплекса.","Атоллда ядро жыныстары кешеннің шетімен сақина не сопақша түзе орналасуы мүмкін.","Atoll core facies can form a ring or oval around the edge of the complex."],"unit":"reef","type":"single","options":[["Атолл","Атолл","Atoll"],["Линейная зональность","Сызықтық белдемділік","Linear zonation"],["Биостром","Биостром","Biostrome"]],"key":0},{"id":"reef-write1","page":203,"prompt":["У какого типа рифа породы ядра могут образовывать кольцо?","Рифтің қай түрінде ядро жыныстары сақина түзе алады?","In which reef form can core facies form a ring?"],"help":["В атоллах породы ядра могут располагаться кольцом или овалом по краю комплекса.","Атоллда ядро жыныстары кешеннің шетімен сақина не сопақша түзе орналасуы мүмкін.","Atoll core facies can form a ring or oval around the edge of the complex."],"unit":"reef","type":"blank","key":["Атолл","Атолл","Atoll"]},{"id":"reef-q2","page":204,"prompt":["Как обычно вытянуты фациальные зоны в описанной линейной рифовой системе?","Сипатталған сызықтық риф жүйесінде фациялық белдемдер қалай созылады?","How are facies zones arranged in the described elongated reef system?"],"help":["Зоны вытянуты вдоль простирания рифовой системы, параллельно друг другу.","Белдемдер риф жүйесінің созылымы бойымен бір-біріне параллель орналасады.","Zones extend parallel to the trend of the reef system."],"unit":"reef","type":"single","options":[["Атолл","Атолл","Atoll"],["Биостром","Биостром","Biostrome"],["Линейная зональность","Сызықтық белдемділік","Linear zonation"]],"key":2},{"id":"reef-write2","page":204,"prompt":["Как обычно вытянуты фациальные зоны в описанной линейной рифовой системе?","Сипатталған сызықтық риф жүйесінде фациялық белдемдер қалай созылады?","How are facies zones arranged in the described elongated reef system?"],"help":["Зоны вытянуты вдоль простирания рифовой системы, параллельно друг другу.","Белдемдер риф жүйесінің созылымы бойымен бір-біріне параллель орналасады.","Zones extend parallel to the trend of the reef system."],"unit":"reef","type":"blank","key":["Линейная зональность","Сызықтық белдемділік","Linear zonation"]},{"type":"single","page":203,"prompt":["Контур рифа вытянут. Что нужно добавить к карте, чтобы различить пологую постройку и высокий узкий массив?","Риф контуры созылған. Жайпақ құрылым мен биік тар массивті ажырату үшін картаға не қосамыз?","A reef outline is elongated. What should accompany the map to distinguish a low platform from a tall narrow buildup?"],"options":[["Разрез поперёк рифа","Рифті көлденең кесетін қима","A cross-section across the reef"],["Один замер плотности на поверхности","Беттегі бір тығыздық өлшемі","One surface density measurement"],["Карту только соседней залежи","Тек көрші кен картасы","A map of only the adjacent accumulation"]],"key":0,"help":["Разрез показывает вертикальную геометрию. На плане непосредственно видны размеры и форма контура.","Қима тік геометрияны көрсетеді. Жоспардан контур өлшемі мен пішіні көрінеді.","A section shows vertical geometry. The plan shows the shape and size of the outline."],"id":"reef-case0","unit":"reef"},{"type":"single","page":203,"prompt":["Длины осей эллиптического контура — 8 и 4 км. Какую площадь даёт приближение A = πab?","Эллипс осьтері 8 және 4 км. A = πab қандай аудан береді?","An elliptical outline has full axes of 8 and 4 km. What area does A = πab give?"],"options":[["Около 101 км²","Шамамен 101 км²","About 101 km²"],["Около 25 км²","Шамамен 25 км²","About 25 km²"],["Около 13 км²","Шамамен 13 км²","About 13 km²"]],"key":1,"help":["Полуоси равны 4 и 2 км. Площадь 8π ≈ 25,1 км².","Жарты осьтер 4 және 2 км. Аудан 8π ≈ 25,1 км².","The semi-axes are 4 and 2 km. The area is 8π ≈ 25.1 km²."],"drill":true,"id":"reef-case1","unit":"reef"}]},{"id":"pores","book":"kuz","pages":"202–205","title":["Поры рифовых пород","Риф жыныстарының кеуектілігі","Pores in reef rocks"],"facts":[{"page":205,"term":["Цементация","Цементтелу","Cementation"],"quiz":["Какой процесс может уменьшить первичную пористость рифа?","Рифтің бастапқы кеуектілігін қандай үдеріс азайта алады?","Which process can reduce primary reef porosity?"],"explanation":["Цемент может заполнять часть первоначальных пустот и снижать первичную пористость.","Цемент бастапқы қуыстардың бір бөлігін толтырып, алғашқы кеуектілікті азайта алады.","Cement can fill some original voids and reduce primary porosity."],"plain":["Между зёрнами породы есть промежутки. Если часть промежутка заполнится минералом-цементом, свободного места для жидкости станет меньше.","Жыныс түйірлерінің арасында бос орындар бар. Бос орынның бір бөлігін минералдық цемент толтырса, сұйықтыққа орын азаяды.","Rock grains can have gaps between them. If mineral cement fills part of a gap, there is less space left for fluid."],"scene":"cement"},{"page":205,"term":["Выщелачивание","Шаймалау","Dissolution"],"quiz":["Какой процесс может образовать вторичные каверны?","Қай үдеріс екінші реттік қуыстарды түзеді?","Which process can produce secondary vugs?"],"explanation":["Активное выщелачивание может создавать вторичные каверновые пустоты.","Белсенді шаймалау екінші реттік қуыстарды түзе алады.","Dissolution can create secondary vugs."],"plain":["Часть уже образовавшейся породы растворяется и уходит с водой. На её месте могут остаться новые полости.","Бұрын қалыптасқан жыныстың бір бөлігі еріп, сумен шайылады. Оның орнында жаңа қуыстар қалуы мүмкін.","Part of the existing rock dissolves and is carried away by water. New cavities can remain where that material used to be."]},{"page":205,"term":["Межкристаллическая пористость","Кристалларалық кеуектілік","Intercrystalline porosity"],"quiz":["Какой тип вторичной пористости автор связывает с перекристаллизацией и доломитизацией?","Автор қайта кристалдану және доломиттенумен қай екінші реттік кеуектілікті байланыстырады?","Which secondary porosity is associated with recrystallization and dolomitization?"],"explanation":["Перекристаллизация и доломитизация могут формировать пустоты между кристаллами.","Қайта кристалдану мен доломиттену кристалдардың арасында қуыстар түзе алады.","Recrystallization and dolomitization can produce voids between crystals."],"plain":["Когда структура породы меняется и образуются новые кристаллы, между ними иногда остаются маленькие промежутки. Эти промежутки и называют межкристаллическими порами.","Жыныстың құрылымы өзгеріп, жаңа кристалдар түзілгенде, олардың арасында кейде ұсақ бос орындар қалады. Бұлар кристалларалық кеуектер деп аталады.","As the rock changes and new crystals form, small gaps can appear between them. These gaps are called intercrystalline pores."]}],"order":[["Опиши исходные пустоты","Бастапқы қуыстарды сипатта","Describe the original voids"],["Отметь поздние изменения породы","Жыныстың кейінгі өзгерістерін белгіле","Identify later rock alteration"],["Объясни современную пустотность","Қазіргі қуыстылықты түсіндір","Explain the resulting pore space"]],"chapter":"10 · §10.2","minutes":24,"outcome":["Различить пористость, проницаемость и влияние цементации.","Кеуектілік, өткізгіштік және цементтелу әсерін ажырату.","Distinguish porosity, permeability and the effects of cementation."],"formulas":[{"page":205,"equation":"φ = Vпор / Vобразца","use":["Пористость измеряет долю пустот. Она сама по себе не задаёт связность этих пустот.","Кеуектілік қуыс үлесін ғана көрсетеді. Ол қуыстар байланысын сипаттамайды.","Porosity measures the fraction of void space. It does not describe how pores connect."],"symbols":[{"name":"φ","description":["пористость, доля единицы","кеуектілік, бірлік үлесі","porosity as a fraction"]},{"name":"Vпор","description":["объём пор, см³","қуыс көлемі, см³","pore volume, cm³"]},{"name":"Vобразца","description":["полный объём образца, см³","үлгінің толық көлемі, см³","bulk sample volume, cm³"]}],"example":["Пример: 16 см³ пор в 100 см³ породы дают 16%.","Мысал: 100 см³ жыныстағы 16 см³ қуыс 16% береді.","Example: 16 cm³ of pores in 100 cm³ of rock gives 16%."],"application":true}],"questions":[{"id":"pores-q0","page":205,"prompt":["Какой процесс может уменьшить первичную пористость рифа?","Рифтің бастапқы кеуектілігі solution can create secondary vugs."],"unit":"pores","type":"blank","key":["Выщелачивание","Шаймалау","Dissolution"]},{"id":"pores-q2","page":205,"prompt":["Какой тип вторичной пористости автор связывает с перекристаллизацией и доломитизацией?","Автор қайта кристалдану және доломиттенумен қай екінші реттік кеуектілікті байланыстырады?","Which secondary porosity is associated with recrystallization and dolomitization?"],"help":["Перекристаллизация и доломитизация могут формировать пустоты между кристаллами.","Қайта кристалдану мен доломиттену кристалдардың арасында қуыстар түзе алады.","Recrystallization and dolomitization can produce voids between crystals."],"unit":"pores","type":"single","options":[["Выщелачивание","Шаймалау","Dissolution"],["Цементация","Цементтелу","Cementation"],["Межкристаллическая пористость","Кристалларалық кеуектілік","Intercrystalline porosity"]],"key":2},{"id":"pores-write2","page":205,"prompt":["Какой тип вторичной пористости автор связывает с перекристаллизацией и доломитизацией?","Автор қайта кристалдану және доломиттенумен қай екінші реттік кеуектілікті байланыстырады?","Which secondary porosity is associated with recrystallization and dolomitization?"],"help":["Перекристаллизация и доломитизация могут формировать пустоты между кристаллами.","Қайта кристалдану мен доломиттену кристалдардың арасында қуыстар түзе алады.","Recrystallization and dolomitization can produce voids between crystals."],"unit":"pores","type":"blank","key":["Межкристаллическая пористость","Кристалларалық кеуектілік","Intercrystalline porosity"]},{"type":"single","page":205,"prompt":["У двух карбонатных образцов пористость 18%. В первом образце поры изолированы, во втором соединены каналами. Какой образец при прочих равных лучше пропускает жидкость?","Екі карбонат үлгісінің кеуектілігі 18%. Біріншісінде қуыстар тұйық, екіншісінде арналармен байланысқан. Басқа шарттар тең болса, қайсысы сұйықтықты жақсы өткізеді?","Two carbonate samples have 18% porosity. Sample 1 has isolated pores and sample 2 has connected channels. Which is more permeable, all else equal?"],"options":[["Первый","Бірінші","Sample 1"],["Оба одинаково","Екеуі бірдей","They are equal"],["Второй","Екінші","Sample 2"]],"key":2,"help":["Связанные поры образуют пути фильтрации. Одна и та же пористость может сочетаться с разной проницаемостью.","Байланысқан қуыстар сүзілу жолын құрайды. Бірдей кеуектілік әртүрлі өткізгіштікке сәйкес келуі мүмкін.","Connected pores provide pathways for flow. Equal porosity can coexist with different permeability."],"id":"pores-case0","unit":"pores"},{"type":"numeric","page":205,"prompt":["Керн объёмом 80 см³ содержит 12 см³ пор. Какова пористость в процентах?","80 см³ кернде 12 см³ қуыс бар. Кеуектілік неше пайыз?","An 80 cm³ core has 12 cm³ of pores. What is its porosity as a percentage?"],"key":15,"help":["φ = 12 / 80 = 0,15 = 15%.","φ = 12 / 80 = 0,15 = 15%.","φ = 12 / 80 = 0.15 = 15%."],"drill":true,"id":"pores-case1","unit":"pores"},{"type":"single","page":205,"prompt":["Два образца вмещают одинаковый объём воды при насыщении. После цементации у одного образца сузились горловины между порами. Какое измерение лучше проверит, ухудшилась ли фильтрация?","Қанығуда екі үлгі бірдей су көлемін ұстайды. Цементтелуден бір үлгінің қуыс мойындары тарылды. Сүзілу нашарлағанын қай өлшем тексереді?","Two saturated samples each hold the same volume of water. Cementation narrowed the pore throats in one sample. Which measurement best tests whether flow capacity declined?"],"options":[["Ещё раз измерить объём воды при насыщении","Қанығудағы су көлемін қайта өлшеу","Repeat the saturated water-volume measurement"],["Измерить расход при одинаковом градиенте давления и одинаковой вязкости","Бірдей қысым градиенті мен тұтқырлықта шығынды өлшеу","Measure flow rate at equal pressure gradient and viscosity"],["Измерить цвет цемента","Цемент түсін өлшеу","Measure cement colour"]],"key":1,"help":["Аккумулируемый объём характеризует поры. Расход через образцы одинаковой геометрии при одинаковых условиях позволяет сравнить их проницаемость.","Жиналған көлем қуыстарды сипаттайды. Геометриясы мен шарттары бірдей үлгілер шығынын салыстыру өткізгіштікті бағалайды.","Stored volume describes pore space. Flow rates through samples with matching geometry and test conditions let you compare permeability."],"unit":"pores","id":"final-case2"}]},{"id":"reef-structure","book":"kuz","title":["Распределение рифовых коллекторов","Риф коллекторларының таралуы","Distribution of reef reservoirs"],"facts":[{"page":207,"term":["Рифовый гребень","Риф жотасы","Reef crest"],"quiz":["К какой части плосковершинного рифа часто приурочена периферическая зона улучшенных коллекторов?","Төбесі жалпақ рифтегі жақсы коллекторлардың шеткі аймағы көбіне қай бөлікке сәйкес келеді?","Which part of a flat-topped reef often hosts the peripheral zone of improved reservoir quality?"],"explanation":["В крупных плосковершинных и атолловидных рифах лучшие коллекторы могут быть смещены к гребню и верхней части внешнего склона.","Ірі жалпақ төбелі және атолл пішінді рифтерде жақсы коллекторлар жотаға және сыртқы беткейдің жоғары бөлігіне ығысуы мүмкін.","In large flat-topped and atoll-like reefs, better reservoirs may occur at the crest and upper outer slope."],"plain":["В крупных плосковершинных и атолловидных рифах лучшие коллекторы могут быть смещены к гребню и верхней части внешнего склона.","Ірі жалпақ төбелі және атолл пішінді рифтерде жақсы коллекторлар жотаға және сыртқы беткейдің жоғары бөлігіне ығысуы мүмкін.","In large flat-topped and atoll-like reefs, better reservoirs may occur at the crest and upper outer slope."]},{"page":210,"term":["Карта пористости","Кеуектілік картасы","Porosity map"],"quiz":["На какой карте изолинии показывают значения коэффициента пористости?","Қай картада изосызықтар кеуектілік коэффициентін көрсетеді?","Which map uses contours to show porosity values?"],"explanation":["Карта пористости показывает свойство породы, а карта фаций — зоны пород и обстановок. Их сопоставляют с разрезом.","Кеуектілік картасы жыныс қасиетін, фация картасы жыныс пен орта аймақтарын көрсетеді. Екеуі қимамен салыстырылады.","A porosity map shows a rock property. A facies map shows zones of rock and depositional environments. Compare both with sections."],"plain":["Карта пористости показывает свойство породы, а карта фаций — зоны пород и обстановок. Их сопоставляют с разрезом.","Кеуектілік картасы жыныс қасиетін, фация картасы жыныс пен орта аймақтарын көрсетеді. Екеуі қимамен салыстырылады.","A porosity map shows a rock property. A facies map shows zones of rock and depositional environments. Compare both with sections."]},{"page":216,"term":["Кольцевая зона","Сақина тәрізді аймақ","Ring-shaped zone"],"quiz":["Какая форма зоны оптимальных коллекторов описана для плосковершинных и атолловидных рифов?","Жалпақ төбелі және атолл пішінді рифтерде жақсы коллектор аймағы қандай?","What shape is described for the best reservoir zone in flat-topped and atoll-like reefs?"],"explanation":["Оптимальные свойства могут следовать вдоль периферического гребня кольцом. Одна центральная скважина может пропустить эту зону.","Жақсы қасиеттер шеткі жота бойымен сақина құруы мүмкін. Бір орталық ұңғыма оны байқамай қалуы мүмкін.","The best properties may follow the crest in a ring. A single central well can miss that zone."],"plain":["Оптимальные свойства могут следовать вдоль периферического гребня кольцом. Одна центральная скважина может пропустить эту зону.","Жақсы қасиеттер шеткі жота бойымен сақина құруы мүмкін. Бір орталық ұңғыма оны байқамай қалуы мүмкін.","The best properties may follow the crest in a ring. A single central well can miss that zone."]}],"chapter":"10 · §10.3","pages":"205–216","minutes":30,"outcome":["Сопоставить положение фаций с распределением свойств резервуара.","Фация орналасуын резервуар қасиеттерінің таралуымен салыстыру.","Relate facies position to reservoir property distribution."],"formulas":[],"q
